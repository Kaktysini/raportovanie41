<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая тренировка | 41-й ЭРК</title>
        
    <!-- Иконка 41-го ЭРК -->
<link rel="icon" type="image/x-icon" href="/raportovanie41/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/raportovanie41/favicon-32x32.png?v=2">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <h1>41-Й ЭЛИТНЫЙ РАЗВЕДЫВАТЕЛЬНЫЙ КОРПУС</h1>
            <p>ПРАКТИЧЕСКАЯ ТРЕНИРОВКА</p>
            <div style="margin-top: 10px;">
                <a href="../dashboard/index.html" class="form-select-btn" style="display: inline-flex; width: auto; padding: 5px 15px; font-size: 12px;">
                    🏠 Главное меню
                </a>
            </div>
        </div>
    </header>

    <main class="report-form-container">

        <div class="form-header">
            <h2>Форма рапорта о тренировках</h2>
        </div>

        <form id="practicalForm">

            <div class="form-group">
                <label for="reporting">Докладывает *</label>

                <input
                    type="text"
                    id="reporting"
                    placeholder="Номер | Позывной | Звание"
                    autocomplete="off"
                    readonly
                    required
                >

                <small style="color: #9ca3af;">
                    Данные автоматически загружаются из вашего профиля.
                </small>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="trainingName">Название тренировки *</label>

                    <input
                        type="text"
                        id="trainingName"
                        placeholder="Название"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="location">База/За базой *</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="На базе / За базой"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="participants">
                    Состав * (Каждый с новой строки)
                </label>

                <textarea
                    id="participants"
                    rows="4"
                    placeholder="Номер | Позывной | Звание"
                    required
                    style="width: 100%; padding: 12px; background: #111312; color: #f3f4f6; border: 1px solid #374151; font-family: 'Consolas', monospace; border-radius: 4px;"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="description">Описание *</label>

                <textarea
                    id="description"
                    rows="3"
                    placeholder="Описание тренировки"
                    required
                    style="width: 100%; padding: 12px; background: #111312; color: #f3f4f6; border: 1px solid #374151; font-family: 'Consolas', monospace; border-radius: 4px;"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="notes">Примечание</label>

                <textarea
                    id="notes"
                    rows="2"
                    placeholder="Пишется при необходимости"
                    style="width: 100%; padding: 12px; background: #111312; color: #f3f4f6; border: 1px solid #374151; font-family: 'Consolas', monospace; border-radius: 4px;"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="reportDate">Дата *</label>

                <input
                    type="date"
                    id="reportDate"
                    required
                >
            </div>

            <div class="form-actions">
                <button
                    type="submit"
                    class="btn-submit"
                    disabled
                >
                    ОТПРАВИТЬ
                </button>
            </div>

            <div
                id="formStatus"
                class="form-status"
            ></div>

        </form>

    </main>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <script src="practical.js"></script>

</body>
</html>
