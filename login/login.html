
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация 41-й ЭРК</title>
        
    <!-- Иконка 41-го ЭРК -->
<link rel="icon" type="image/x-icon" href="/raportovanie41/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/raportovanie41/favicon-32x32.png?v=2">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <h1>41-Й ЭЛИТНЫЙ РАЗВЕДЫВАТЕЛЬНЫЙ КОРПУС</h1>
            <p>СИСТЕМА АВТОРИЗАЦИИ</p>
        </div>
    </header>

    <main class="report-form-container" style="max-width: 450px; margin-top: 50px;">
        <div class="form-header">
            <h2 id="authTitle">ВХОД В СИСТЕМУ</h2>
            <p>Введите ваш номер бойца и пароль.</p>
        </div>

        <form id="authForm">
            <div class="form-group">
                <label for="soldierNumber">Номер бойца *</label>
                <input
                    type="text"
                    id="soldierNumber"
                    placeholder="Например: 12345"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Пароль *</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Минимум 6 символов"
                    required
                >
            </div>

            <div class="form-actions" style="flex-direction: column;">
                <button type="submit" class="btn-submit" id="authBtn">
                    ВОЙТИ
                </button>

                <button
                    type="button"
                    class="btn-reset"
                    id="toggleAuthBtn"
                    style="margin-top: 10px;"
                >
                    У меня нет аккаунта
                </button>
            </div>

            <div id="authStatus" class="form-status"></div>
        </form>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <script src="auth.js"></script>
</body>
</html>
