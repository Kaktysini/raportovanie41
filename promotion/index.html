
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрос на повышение | 41-й ЭРК</title>
        
    <!-- Иконка сайта -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header">
    <div class="logo-container">
        <h1>41-Й ЭЛИТНЫЙ РАЗВЕДЫВАТЕЛЬНЫЙ КОРПУС</h1>
        <p>ЗАПРОС НА ПОВЫШЕНИЕ</p>
        <div style="margin-top:10px;">
            <a href="../dashboard/index.html" style="color:#4caf50;text-decoration:none;margin-right:15px;">🏠 Главное меню</a>
            <button id="logoutBtn" class="btn-logout">Выйти</button>
        </div>
    </div>
</header>

<main class="report-form-container">
    <div class="form-header">
        <h2>Запрос на получение нового звания</h2>
        <p>Заполните заявку. Администрация рассмотрит её и уведомит вас о решении.</p>
    </div>

    <div id="currentRankInfo" style="background:#1e221f;border:1px solid #374151;padding:15px;border-radius:4px;margin-bottom:20px;">
        Загрузка информации о звании...
    </div>

    <form id="promotionForm" style="display:none;">
        <div class="form-group">
            <label for="reporting">Докладывает *</label>
            <input
    type="text"
    id="reporting"
    name="reporting"
    placeholder="Номер | Позывной | Звание"
    readonly
    required
>
        </div>

        <div class="form-group">
            <label for="requestedRank">Запрашиваемое новое звание *</label>
            <select id="requestedRank" name="requestedRank" required>
                <option value="">Загрузка списка званий...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="requestReason">Обоснование запроса *</label>
            <textarea id="requestReason" rows="5" required maxlength="2000" placeholder="Укажите достижения и основания для повышения." style="width:100%;padding:12px;background:#111312;color:#f3f4f6;border:1px solid #374151;border-radius:4px;"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">ОТПРАВИТЬ ЗАПРОС</button>
            <button type="reset" class="btn-reset">СБРОСИТЬ</button>
        </div>
    </form>

    <div id="rankRequestState" style="display:none;"></div>
    <div id="formStatus" class="form-status"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
