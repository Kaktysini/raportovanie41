<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рапорт об изменении звания | 41-й ЭРК</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="logo-container">

            <h1>41-Й ЭЛИТНЫЙ РАЗВЕДЫВАТЕЛЬНЫЙ КОРПУС</h1>

            <p>ПОРТАЛ СЛУЖЕБНЫХ РАПОРТОВ</p>

            <div style="margin-top: 10px;">

                <a
                    href="../dashboard/index.html"
                    style="color: #4caf50; text-decoration: none; font-size: 14px; margin-right: 15px;"
                >
                    🏠 Главное меню
                </a>

                <button id="logoutBtn" class="btn-logout">
                    Выйти
                </button>

            </div>

        </div>
    </header>


    <main class="report-form-container">

        <div class="form-header">

            <h2>Новый рапорт об изменении звания</h2>

            <p>
                Резервная система. Данные уходят напрямую в Канцелярию.
            </p>

        </div>


        <form id="reportForm">

            <div class="form-grid">

                <!-- ДОКЛАДЫВАЮЩИЙ И ВЫДАЮЩИЙ ФОРМУ -->

                <div class="form-group full-width">

                    <label for="reporting">
                        Докладывает / выдаёт форму *
                    </label>

                    <input
                        type="text"
                        id="reporting"
                        name="reporting"
                        placeholder="Номер | Позывной | Звание"
                        autocomplete="off"
                        readonly
                        required
                    >

                    <small style="color: #9ca3af;">
                        Данные автоматически загружаются из профиля.
                    </small>

                </div>


                <!-- ДАННЫЕ БОЙЦА, КОТОРОМУ МЕНЯЮТ ЗВАНИЕ -->

                <div class="form-group full-width">

                    <label for="soldierInfo">
                        Н | П бойца *
                    </label>

                    <input
                        type="text"
                        id="soldierInfo"
                        name="soldierInfo"
                        placeholder="Номер | Позывной бойца"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- STEAM ID: ТОЛЬКО ДЛЯ КАДЕТА -->

                <div
                    class="form-group full-width"
                    id="steamIdGroup"
                    style="display: none;"
                >

                    <label for="steamId">
                        SteamID *
                    </label>

                    <input
                        type="text"
                        id="steamId"
                        name="steamId"
                        placeholder="765611980xxxxxxxx"
                        autocomplete="off"
                        disabled
                    >

                    <small style="color: #9ca3af;">
                        SteamID требуется только при повышении с кадета.
                    </small>

                </div>


                <!-- СТАРОЕ ЗВАНИЕ -->

                <div class="form-group">

                    <label for="oldRank">
                        Старое звание *
                    </label>

                    <select
                        id="oldRank"
                        name="oldRank"
                        required
                    >

                        <option value="" selected disabled>
                            Выберите старое звание
                        </option>

                        <option value="Маршал">Маршал</option>
                        <option value="Коммандер">Коммандер</option>
                        <option value="Командир первого класса">Командир первого класса</option>
                        <option value="Командир">Командир</option>
                        <option value="Полковник">Полковник</option>
                        <option value="Подполковник">Подполковник</option>
                        <option value="Майор">Майор</option>
                        <option value="Капитан">Капитан</option>
                        <option value="Лейтенант">Лейтенант</option>
                        <option value="Младший лейтенант">Младший лейтенант</option>
                        <option value="Сержант-майор сухопутных войск">Сержант-майор сухопутных войск</option>
                        <option value="Команд сержант-майор">Команд сержант-майор</option>
                        <option value="Сержант-майор">Сержант-майор</option>
                        <option value="Первый сержант">Первый сержант</option>
                        <option value="Мастер-сержант">Мастер-сержант</option>
                        <option value="Сержант первого класса">Сержант первого класса</option>
                        <option value="Штаб-сержант">Штаб-сержант</option>
                        <option value="Сержант">Сержант</option>
                        <option value="Капрал">Капрал</option>
                        <option value="Специалист">Специалист</option>
                        <option value="Старший рядовой">Старший рядовой</option>
                        <option value="Рядовой">Рядовой</option>
                        <option value="Рядовой-рекрут">Рядовой-рекрут</option>
                        <option value="Кадет">Кадет</option>

                    </select>

                </div>


                <!-- НОВОЕ ЗВАНИЕ -->

                <div class="form-group">

                    <label for="newRank">
                        Новое звание *
                    </label>

                    <select
                        id="newRank"
                        name="newRank"
                        required
                    >

                        <option value="" disabled>
                            Выберите новое звание
                        </option>

                        <option value="Маршал">Маршал</option>
                        <option value="Коммандер">Коммандер</option>
                        <option value="Командир первого класса">Командир первого класса</option>
                        <option value="Командир">Командир</option>
                        <option value="Полковник">Полковник</option>
                        <option value="Подполковник">Подполковник</option>
                        <option value="Майор">Майор</option>
                        <option value="Капитан">Капитан</option>
                        <option value="Лейтенант">Лейтенант</option>
                        <option value="Младший лейтенант">Младший лейтенант</option>
                        <option value="Сержант-майор сухопутных войск">Сержант-майор сухопутных войск</option>
                        <option value="Команд сержант-майор">Команд сержант-майор</option>
                        <option value="Сержант-майор">Сержант-майор</option>
                        <option value="Первый сержант">Первый сержант</option>
                        <option value="Мастер-сержант">Мастер-сержант</option>
                        <option value="Сержант первого класса">Сержант первого класса</option>
                        <option value="Штаб-сержант">Штаб-сержант</option>
                        <option value="Сержант">Сержант</option>
                        <option value="Капрал">Капрал</option>
                        <option value="Специалист">Специалист</option>
                        <option value="Старший рядовой">Старший рядовой</option>
                        <option value="Рядовой">Рядовой</option>
                        <option value="Рядовой-рекрут">Рядовой-рекрут</option>
                        <option value="Кадет">Кадет</option>

                    </select>

                </div>


                <!-- STEAM ID ВСТАВЛЯЕТСЯ ОТДЕЛЬНО ВЫШЕ ПРИ НЕОБХОДИМОСТИ -->


                <!-- ДАТА РАПОРТА -->

                <div class="form-group full-width">

                    <label for="reportDate">
                        Дата рапорта *
                    </label>

                    <input
                        type="date"
                        id="reportDate"
                        name="reportDate"
                        required
                    >

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-submit"
                    disabled
                >
                    ОТПРАВИТЬ РАПОРТ
                </button>

                <button
                    type="reset"
                    class="btn-reset"
                >
                    СБРОСИТЬ
                </button>

            </div>


            <div
                id="formStatus"
                class="form-status"
            ></div>

        </form>

    </main>


    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>

</body>
</html>
